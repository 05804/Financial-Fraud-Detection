services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
