name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        run: pytest -q

      - name: Build Streamlit Docker image
        run: docker build -t fraud-dashboard:ci .

      - name: Build FastAPI Docker image
        run: docker build -f api/Dockerfile -t fraud-api:ci .


      - name: Scan Streamlit Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-dashboard:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan FastAPI Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
