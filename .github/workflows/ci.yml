name: CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        run: pytest -q

      - name: Build Streamlit Docker image
        run: docker build -t fraud-dashboard:ci .

      - name: Build FastAPI Docker image
        run: docker build -f api/Dockerfile -t fraud-api:ci .

      - name: Scan Streamlit Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-dashboard:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan FastAPI Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::169523632531:role/GitHubActions-FinancialFraudDeployment
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag FastAPI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag fraud-api:ci 169523632531.dkr.ecr.ap-south-1.amazonaws.com/financial-fraud-detection:api-${{ github.sha }}
          docker tag fraud-api:ci 169523632531.dkr.ecr.ap-south-1.amazonaws.com/financial-fraud-detection:api-latest

      - name: Push FastAPI image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push 169523632531.dkr.ecr.ap-south-1.amazonaws.com/financial-fraud-detection:api-${{ github.sha }}
          docker push 169523632531.dkr.ecr.ap-south-1.amazonaws.com/financial-fraud-detection:api-latest

      - name: Deploy FastAPI to EC2 via SSM with rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_URI: 169523632531.dkr.ecr.ap-south-1.amazonaws.com/financial-fraud-detection:api-${{ github.sha }}
          INSTANCE_ID: i-026b325a5ee8f0952
        run: |
          cat > deploy.sh <<'EOF'
          #!/bin/bash
          set -u

          PREVIOUS_IMAGE="$(docker inspect fraud-api --format '{{.Config.Image}}' 2>/dev/null || true)"
          echo "Previous image: ${PREVIOUS_IMAGE:-<none>}"
          echo "New image: __IMAGE_URI__"

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: No previous fraud-api image found. Refusing deployment without rollback target."
            exit 1
          fi

          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region ap-south-1 | \
            docker login --username AWS --password-stdin \
            169523632531.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pulling new image..."
          docker pull "__IMAGE_URI__"

          echo "Stopping current container..."
          docker stop fraud-api || true
          docker rm fraud-api || true

          echo "Starting new container..."
          docker run -d \
            --name fraud-api \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            "__IMAGE_URI__"

          sleep 5

          if curl -fsS http://127.0.0.1:8000/health; then
            echo "New deployment is healthy."
            exit 0
          fi

          echo "New deployment failed health check."
          echo "Recent application logs:"
          docker logs --tail 50 fraud-api || true

          echo "Starting rollback to previous image: $PREVIOUS_IMAGE"

          docker stop fraud-api || true
          docker rm fraud-api || true

          docker pull "$PREVIOUS_IMAGE"

          docker run -d \
            --name fraud-api \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            "$PREVIOUS_IMAGE"

          sleep 5

          if curl -fsS http://127.0.0.1:8000/health; then
            echo "Rollback successful."
            echo "Production restored to: $PREVIOUS_IMAGE"
            exit 1
          fi

          echo "ROLLBACK FAILED. Manual intervention is required."
          docker logs --tail 50 fraud-api || true
          exit 1
          EOF

          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" deploy.sh
          DEPLOY_SCRIPT_B64=$(base64 -w0 deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Financial Fraud API $GITHUB_SHA with rollback" \
            --parameters "commands=[\"echo $DEPLOY_SCRIPT_B64 | base64 -d > /tmp/fraud-deploy.sh && chmod +x /tmp/fraud-deploy.sh && /tmp/fraud-deploy.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "External HTTPS health check..."
          curl -fsS https://skfrauddetection.duckdns.org/health